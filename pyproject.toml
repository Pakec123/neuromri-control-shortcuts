[build-system]
requires = ["setuptools==75.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromri-control-shortcuts"
version = "0.1.0"
description = "Control-cohort and threshold-transport analyses for neurodegenerative MRI"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["neuromri*"]
